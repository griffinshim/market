<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TEMPLE B | 간편 먹거리 & 가성비 맛집 좌표</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Pretendard, -apple-system, sans-serif; }
    body { background: linear-gradient(180deg, #180e0a 0%, #0c0705 100%); color: #fff7ed; min-height: 100vh; padding: 32px 16px 60px 16px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 440px; }
    .profile-header { text-align: center; margin-bottom: 28px; }
    .profile-avatar { width: 84px; height: 84px; border-radius: 50%; background: linear-gradient(135deg, #431407, #270e05); border: 2px solid #f97316; display: inline-flex; align-items: center; justify-content: center; font-size: 34px; box-shadow: 0 0 24px rgba(249, 115, 22, 0.4); margin-bottom: 14px; }
    .profile-handle { font-size: 14px; color: #f97316; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 6px; }
    .profile-title { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
    .profile-desc { font-size: 13px; color: #fed7aa; line-height: 1.5; }
    .card-list { display: flex; flex-direction: column; gap: 16px; }
    .product-card { background: rgba(36, 24, 18, 0.85); border: 1px solid rgba(249, 115, 22, 0.25); border-radius: 20px; padding: 16px; display: flex; gap: 16px; backdrop-filter: blur(16px); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3); }
    .card-thumb { width: 100px; height: 100px; border-radius: 14px; background-size: cover; background-position: center; position: relative; flex-shrink: 0; border: 1px solid rgba(255, 255, 255, 0.1); }
    .card-index { position: absolute; top: 6px; left: 6px; background: rgba(0, 0, 0, 0.8); color: #fff; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 6px; }
    .card-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; margin-bottom: 6px; background: linear-gradient(135deg, #ea580c, #c2410c); color: #fff; align-self: flex-start; }
    .badge.hot { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
    .card-title { font-size: 15px; font-weight: 700; line-height: 1.35; margin-bottom: 4px; color: #fff7ed; }
    .card-hook { font-size: 12px; color: #fdba74; margin-bottom: 12px; }
    .buy-btn { display: block; width: 100%; text-align: center; background: linear-gradient(135deg, #f97316, #ea580c); color: #fff; text-decoration: none; font-size: 13px; font-weight: 700; padding: 10px 14px; border-radius: 10px; box-shadow: 0 4px 14px rgba(249, 115, 22, 0.4); transition: transform 0.1s ease; }
    .buy-btn:active { transform: scale(0.98); }
    .footer-note { text-align: center; margin-top: 40px; font-size: 11px; color: #a8a29e; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile-header">
      <div class="profile-avatar">🍗</div>
      <div class="profile-handle">@templeb.official</div>
      <h1 class="profile-title">TEMPLE B 간편 먹거리 샵</h1>
      <p class="profile-desc">외식 물가 폭등 시대, 결국 다들 선택한 가성비 먹거리!<br>영상 속 화제 제품 최저가 & 특가 직결 좌표 모음</p>
    </div>
    <div class="card-list">
      <!-- 2호 제품 (최신 라이브) -->
      <div class="product-card">
        <div class="card-thumb" style="background-image: url('https://replacement-automation-future-member.trycloudflare.com/assets/run_20261013_183000/templeb/photo1.jpg')">
          <span class="card-index">#02</span>
        </div>
        <div class="card-info">
          <span class="badge hot">🔥 9,900원 한정 특가</span>
          <h3 class="card-title">100% 통닭다리살 치킨스테이크 (1kg)</h3>
          <p class="card-hook">치킨 1마리 3만원 시대, 냉동실 필수 쟁여템</p>
          <a href="https://www.coupang.com/np/search?component=&q=마블코팅+딥+웍팬+28cm" target="_blank" rel="noopener noreferrer" class="buy-btn">특가 구매 좌표 바로가기 ➔</a>
        </div>
      </div>

      <!-- 1호 제품 -->
      <div class="product-card">
        <div class="card-thumb" style="background-image: url('https://replacement-automation-future-member.trycloudflare.com/assets/run_20261013_093700/templeb/photo1.jpg')">
          <span class="card-index">#01</span>
        </div>
        <div class="card-info">
          <span class="badge">특급 인기</span>
          <h3 class="card-title">불맛 가득 황금 볶음밥 밀키트</h3>
          <p class="card-hook">배달보다 빠른 5분 뚝딱 황금 볶음밥</p>
          <a href="https://www.coupang.com/np/search?component=&q=냉동+볶음밥+밀키트" target="_blank" rel="noopener noreferrer" class="buy-btn">구매 좌표 바로가기 ➔</a>
        </div>
      </div>
    </div>
    <div class="footer-note">© 2026 TEMPLE B. All Rights Reserved.</div>
  </div>
</body>
</html>
